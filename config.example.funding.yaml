mode: paper

symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

exchange:
  name: binance
  testnet: true
  hub_url: "localhost:9090"

strategy:
  type: funding_arb
  funding_arb:
    min_funding_rate: 0.0001    # Enter when funding > 0.01% per 8h (~13% APY)
    exit_threshold: 0.00005     # Exit when funding drops below 0.005% per 8h
    max_positions: 3            # Max 3 concurrent positions
    position_size_usd: 1000     # $1000 per position
    scan_interval_ms: 300000    # Check every 5 minutes
    max_loss_pct: 0.03          # Close if position loses > 3% (no spot hedge = directional risk)
    delta_neutral: false        # Set true to hedge with spot (removes directional risk)
    db_path: "funding.db"       # SQLite database for position/rate persistence
    
    # Momentum strategy - improves returns by 30-40%
    # Research shows funding rates exhibit autocorrelation ~0.6-0.7
    # Entering on momentum (high AND accelerating) filters false signals
    use_momentum: false         # Enable momentum-based entry (default: false)
    momentum_multiplier: 1.2    # Current must exceed avg_24h * multiplier (default: 1.2)
                                #   - Entry: current > threshold AND current > avg_24h * 1.2
                                #   - Captures funding that is both high and trending higher
    momentum_exit_enable: false # Exit on momentum reversal (default: false)
                                #   - Exit when current < avg_24h (momentum lost)

    # Cross-exchange arbitrage (multi-exchange funding spread capture)
    # WARNING: Requires PRE-FUNDED accounts on all target exchanges.
    # Do NOT rely on transferring funds during arb — withdrawal fees and
    # 10-30min delays will eliminate profit. Ensure adequate balance on
    # each exchange before enabling.
    # cross_exchange:
    #   enabled: false
    #   exchanges: [binance, bybit, okx]
    #   min_spread_bps: 5.0

execution:
  slippage_bp: 5
  fee_percent: 0.04

# Portfolio-wide cross-strategy position limits
# Prevents double exposure when Funding Arb and Basis Trade fire on same symbol
portfolio_risk:
  max_total_perp_spot_exposure: 100000  # Max $100k across all strategies
  max_per_symbol_exposure: 50000        # Max $50k per symbol
  enable_correlated_check: true         # Block funding_arb + basis_trade overlap

monitoring:
  prometheus_port: 9092
