mode: paper

exchange:
  name: binance
  testnet: false
  api_key: ""
  api_secret: ""

symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT

bar_size: "4h"

strategy:
  type: trend_following
  donchian_period: 20
  ema_fast: 9
  ema_slow: 21
  ema_confirm_bars: 5
  ema_trend: 50
  volume_period: 20
  atr_period: 14
  atr_stop_multiplier: 3.0
  adx_period: 14
  adx_threshold: 20.0
  volatility_low: 0.5
  volatility_high: 2.5
  chandelier_lookback: 10

  funding_filter:
    enabled: true
    extreme_threshold: 0.0005
    elevated_threshold: 0.0003
    size_reduction: 0.5
    poll_interval_seconds: 300

  partial_exits:
    enabled: true
    first_target_r: 3.0
    first_exit_pct: 0.25
    second_target_r: 6.0
    second_exit_pct: 0.25

risk:
  max_risk_per_trade_pct: 1.0
  max_daily_loss_pct: 3.0
  max_open_positions: 4
  max_leverage: 2.0
  initial_equity: 10000.0

execution:
  use_limit_orders: false
  slippage_bp: 5.0
  fee_percent: 0.04

monitoring:
  prometheus_port: 9090

alerts:
  telegram_bot_token: ""
  telegram_chat_id: 0

# Legacy ML settings (kept for backward compatibility, not used by trend_following)
sentiment:
  url: http://localhost:8000
  poll_interval_seconds: 60
  sentiment_threshold_long: 0.3
  sentiment_threshold_short: -0.3

model:
  path: ""
  runtime_lib_path: ""
  threshold_up: 0.6
  threshold_down: 0.6
  num_classes: 3
  timeframe: "4h"
